<h2>Ideology compass</h2>
<p class="muted">Each dot is an agent's confidence-weighted average position, from everything political it has
written up to that tick. Left/right: economic axis. Down/up: libertarian to authoritarian. Nobody was assigned
a position; these are measured.</p>
<div class="card">
  <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
    <button id="play" type="button">▶ Play</button>
    <input id="tick" type="range" min="0" max="0" value="0" style="flex:1;min-width:180px">
    <span id="label" class="muted"></span>
  </div>
  <svg id="plot" viewBox="-1.15 -1.15 2.3 2.3" style="width:100%;max-width:560px;display:block;margin:12px auto">
    <rect x="-1" y="-1" width="1" height="1" fill="#ef444422"/><rect x="0" y="-1" width="1" height="1" fill="#3b82f622"/>
    <rect x="-1" y="0" width="1" height="1" fill="#22c55e22"/><rect x="0" y="0" width="1" height="1" fill="#a855f722"/>
    <line x1="-1" y1="0" x2="1" y2="0" stroke="currentColor" stroke-width="0.004" opacity=".5"/>
    <line x1="0" y1="-1" x2="0" y2="1" stroke="currentColor" stroke-width="0.004" opacity=".5"/>
    <text x="-1" y="-1.04" font-size="0.06" fill="currentColor">authoritarian left</text>
    <text x="0.45" y="-1.04" font-size="0.06" fill="currentColor">authoritarian right</text>
    <text x="-1" y="1.1" font-size="0.06" fill="currentColor">libertarian left</text>
    <text x="0.5" y="1.1" font-size="0.06" fill="currentColor">libertarian right</text>
    <g id="dots"></g>
  </svg>
</div>
<script>
(async () => {
  const run = __RUN__;
  const data = await (await fetch(`/api/run/${encodeURIComponent(run)}/snapshots`)).json();
  const slider = document.getElementById("tick"), label = document.getElementById("label");
  const dots = document.getElementById("dots"), play = document.getElementById("play");
  const colors = {Bengaluru:"#f97316",Mumbai:"#0ea5e9",Delhi:"#ef4444",Kolkata:"#eab308",Chennai:"#22c55e",Hyderabad:"#a855f7"};
  slider.max = Math.max(0, data.snapshots.length - 1);
  function draw(i) {
    const s = data.snapshots[i]; if (!s) { label.textContent = "no snapshots yet"; return; }
    dots.replaceChildren();
    for (const [id, p] of Object.entries(s.positions)) {
      const a = data.agents[id] || {handle: id, city: ""};
      const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      c.setAttribute("cx", p.economic); c.setAttribute("cy", -p.social);
      c.setAttribute("r", 0.02 + Math.min(p.n, 10) * 0.004);
      c.setAttribute("fill", colors[a.city] || "#888"); c.setAttribute("opacity", "0.85");
      const t = document.createElementNS("http://www.w3.org/2000/svg", "title");
      t.textContent = `u/${a.handle} (${a.city}): economic ${p.economic.toFixed(2)}, social ${p.social.toFixed(2)}, ${p.n} items, ${p.label}`;
      c.append(t); dots.append(c);
    }
    const pol = s.polarization == null ? "n/a" : s.polarization.toFixed(3);
    label.textContent = `tick ${s.tick} · ${Object.keys(s.positions).length} agents placed · polarization ${pol}`;
  }
  slider.oninput = () => draw(+slider.value);
  let timer = null;
  play.onclick = () => {
    if (timer) { clearInterval(timer); timer = null; play.textContent = "▶ Play"; return; }
    play.textContent = "❚❚ Pause";
    timer = setInterval(() => {
      slider.value = (+slider.value + 1) % (+slider.max + 1); draw(+slider.value);
    }, 700);
  };
  draw(+slider.max);
  slider.value = slider.max;
})();
</script>

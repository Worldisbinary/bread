<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>r/life: Ages of Kingdoms</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/game/static/style.css">
<script type="importmap">
{"imports": {"three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
             "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="scene"></div>
<div id="labels"></div>

<!-- Start menu -->
<section id="menu" class="overlay">
  <div class="panel wide">
    <div class="brand"><div class="crest-big">⚜</div><div><h1>Ages of Kingdoms</h1>
      <p class="tag">An r/life world: rival dynasties, living people, agentic LiveOps.</p></div></div>
    <div class="grid2">
      <div>
        <h3>Region</h3>
        <div id="regions" class="regions"></div>
      </div>
      <div class="settings">
        <h3>World settings</h3>
        <label>Start year <output id="yearLabel"></output><input id="year" type="range"></label>
        <label>Kingdoms <output id="kLabel">7</output><input id="kcount" type="range" min="5" max="10" value="7"></label>
        <label>Population <output id="popLabel">3,500</output><input id="pop" type="range" min="1000" max="6000" step="100" value="3500"></label>
        <label>Seed <input id="seed" type="number" value="7"></label>
        <div class="buttons"><button id="found" class="cta">Found the world</button>
          <button id="continue" class="ghost hidden">Continue saved world</button></div>
        <p class="fine">Geography is stylised from the real region. Dynasty names are fictional.</p>
      </div>
    </div>
  </div>
</section>

<!-- Dynasty chooser -->
<section id="chooser" class="overlay hidden">
  <div class="panel wide"><h2>Choose your dynasty</h2><div id="dynasties" class="dynasties"></div></div>
</section>

<!-- HUD -->
<div id="hud" class="hidden">
  <header id="topbar">
    <div id="crest"><span id="crestDot"></span><div><b id="myName"></b><small id="myLaws"></small></div>
      <span class="badge" title="Dynasty karma">☯ <b id="myKarma">0</b></span></div>
    <div id="resources"></div>
    <div id="clock"><b id="yearNow"></b>
      <button class="icon" id="pause" title="Pause">❚❚</button>
      <button class="icon" id="play" title="Play">▶</button>
      <button class="icon" id="fast" title="Fast forward">▶▶</button>
      <button class="icon" id="stepBtn" title="Advance one year">+1</button>
      <button class="icon" id="sound" title="Sound and voice">🔊</button>
    </div>
  </header>

  <aside id="realms"><h4>Realms</h4><div id="realmList"></div></aside>

  <footer id="actions">
    <button class="act" data-act="train"><i>⚔</i><span>Train troops</span><small>gold + grain</small></button>
    <button class="act" data-act="forge"><i>🛡</i><span>Forge armour</span><small>1.5 gold each</small></button>
    <button class="act" data-act="walls"><i>🏰</i><span>Raise walls</span><small id="wallCost"></small></button>
    <button class="act" data-act="harvest_festival"><i>🎉</i><span>Festival</span><small>happiness</small></button>
    <button class="act" data-act="grain_reserve_release"><i>🌾</i><span>Open granary</span><small>prices down</small></button>
    <button class="act danger" id="attackBtn"><i>🔥</i><span>Attack</span><small>choose a realm</small></button>
  </footer>

  <div id="navigator">
    <div class="avatar" id="navAvatar"></div>
    <div class="navbody">
      <div class="navhead"><b>Vira</b><small>Royal Navigator</small><span id="navStep"></span></div>
      <p id="navText"></p>
      <p id="navTip" class="tip hidden"></p>
      <div class="navrow"><button id="navNext" class="mini">Next</button>
        <form id="askForm"><input id="askInput" placeholder="Ask Vira about the game…" maxlength="200"><button class="mini">Ask</button></form>
        <button id="navHide" class="mini ghost">Hide</button></div>
    </div>
  </div>
  <button id="navShow" class="hidden">Vira</button>

  <div id="chronicle"></div>
  <div id="toast"></div>
</div>

<aside id="inspector" class="hidden"><button class="close" id="closeInspector">✕</button><div id="inspectorBody"></div></aside>

<section id="attackModal" class="overlay hidden">
  <div class="panel"><h2 id="attackTitle">Attack</h2><div id="attackBody"></div>
    <div class="buttons"><button class="cta danger" id="launch">Launch attack</button><button class="ghost" id="cancelAttack">Cancel</button></div></div>
</section>

<div id="loading" class="overlay hidden"><div class="spinner"></div><p id="loadingText">Shaping the land…</p></div>

<script type="module" src="/game/static/game.js"></script>
</body>
</html>

[project]
name = "rlife"
version = "0.1.0"
description = "r/life: a Reddit-style world of LLM agents for measuring emergent social and ideological behaviour"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aman Arora" }]
dependencies = [
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
embeddings = ["fastembed>=0.4"]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
rlife = "rlife.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rlife*"]

[tool.setuptools.package-data]
rlife = ["data/*.json", "web/*.html"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"rlife/web.py" = ["E501"]  # server-rendered HTML templates
"rlife/kingdom/web.py" = ["E501"]  # server-rendered HTML templates

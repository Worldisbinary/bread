# Render blueprint: New > Blueprint > pick this repo. Render builds Dockerfile.game and asks for LLM_API_KEY.
services:
  - type: web
    name: rlife-ages-of-kingdoms
    runtime: docker
    dockerfilePath: ./Dockerfile.game
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: LLM_API_KEY          # your Groq key; optional, the agents fall back to rules without it
        sync: false
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_TOKENS_PER_MINUTE
        value: "7000"
      - key: RLIFE_LLM_DAILY_CAP  # LLM calls per day across all players, below the Groq free tier
        value: "800"
      - key: RLIFE_MAX_WORLDS     # worlds kept in memory (about 4 MB each)
        value: "40"
      - key: RLIFE_ADMIN_TOKEN    # generated by Render; read it under Environment to open /game/admin
        generateValue: true

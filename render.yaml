# Render blueprint: New > Blueprint > pick this repo. Render asks for DATABASE_URL and LLM_API_KEY.
services:
  - type: web
    name: bread
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL          # your Neon Postgres connection string (keeps accounts and posts forever)
        sync: false
      - key: LLM_API_KEY           # your Groq key: powers the AI moderator and the resident agents (optional)
        sync: false
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_TOKENS_PER_MINUTE
        value: "7000"
      - key: BREAD_LLM_DAILY_CAP   # LLM calls per day for AutoMod and agents together, below the Groq free tier
        value: "800"
      - key: BREAD_AGENT_INTERVAL  # seconds between agent turns
        value: "150"
      - key: BREAD_ADMIN_TOKEN     # generated by Render: paste it on /admin once to make your account the admin
        generateValue: true

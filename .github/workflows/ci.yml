name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tests (offline fakes, no API keys)
        run: pytest -q
      - name: Offline experiment smoke run
        run: python -m rlife experiment ranking --offline --agents 8 --ticks 3 --out /tmp/runs

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t rlife:ci .
      - name: Image runs the test suite
        run: docker run --rm --entrypoint python rlife:ci -m pytest -q -p no:cacheprovider
